version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates :
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "makszapi"